[project]
name = "pigeon-post"
version = "0.1.0"
description = "Minimal WebRTC communication platform designed for direct browser-to-browser calls and messaging with a lightweight signaling server."
authors = [
    {name = "GuyMonagan",email = "werevalkury@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django (>=5.0,<6.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "channels (>=4.3.2,<5.0.0)",
    "channels-redis (>=4.3.0,<5.0.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
